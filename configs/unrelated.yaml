protocol: semantic-tests-1
models:
  qwen35: Qwen/Qwen3.5-9B
  qwen38: Qwen/Qwen3.8-27B
  qwen25: Qwen/Qwen2.5-Coder-7B-Instruct
  qwen36: Qwen/Qwen3.6-27B
  deepseek: deepseek-ai/deepseek-coder-6.7b-instruct
generation:
  dtype: bfloat16
  prompt_format: chat
  thinking: disabled
  temperature: 0.0
  seed: 0
  order_seed: 0
  max_new_tokens: 8192
  max_model_len: 16384
  batch_size: 1024
  max_num_seqs: 32
tokenizers:
  deepseek: data/model_tokenizers/deepseek-coder-6.7b-instruct
experiments:
  unrelated:
    dataset: data/controlled/unrelated/tasks.jsonl
    models:
    - qwen25
    - qwen36
    - deepseek
    - qwen35
    - qwen38
    repeats: 3
    conditions:
    - unrelated_tests
    baseline_experiment: main
    primary_contrasts:
    - - unrelated_tests
      - nl_tests
    - - nl_only
      - unrelated_tests
    cluster: task_id
evaluation:
  lcb_root: .tmp/LiveCodeBench
  workers: 8
  timeout_seconds: 15
  bootstrap_samples: 5000
  primary_label: heldout_passed
execution_overrides:
  unrelated:
    qwen38:
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.6
